name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt needs to be run on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        # CGO_ENABLED=0 doubles as a check that no dependency secretly needs cgo,
        # which matters for self-hosters without a C toolchain (see db/README.md).
        env:
          CGO_ENABLED: "0"
        run: go test ./...
